Analiza mes a mes cada hogar.`,opciones:{A:"Hogar A en marzo: sube de 138 a 152 = +10,1% es la mayor variación",B:"Hogar D en febrero: baja de 520 a 490 = -5,7% es la mayor variación absoluta",C:"Hogar B en abril: sube de 205 a 215 = +4,8% es la mayor",D:"Hogar C en marzo: sube de 335 a 360 = +7,4% es la mayor"},correcta:"A",explicacion:"Correcta A: 14/138=10,14% es la mayor. B es 5,7%, C 4,8%, D 7,46%. A diferencia: la trampa es mirar solo diferencia absoluta (30 kWh en D) sin dividir por base. El ICFES evalúa si comparas relativo vs absoluto. A falla si solo ves números grandes.",tip:"Tip ICFES Matemáticas: En variación porcentual siempre divide por el valor inicial, no por el final. Y ojo: una subida de 14 sobre 138 pesa más que 30 sobre 520."},{id:"mat-2",area:"matematicas",competencia:"Formulación y ejecución - Componente Numérico-variacional",tipo:"Álgebra y funciones",contexto:"Una empresa de envíos cobra tarifa: $4.000 base + $150 por cada kilogramo. Un colegio envía 12 cajas idénticas que pesan en total w kilos. El costo total fue $22.000.",enunciado:"¿Cuál ecuación permite hallar w y cuánto pesa cada caja?",grafico:"Costo = 4000 + 150·w",opciones:{A:"4000+150w=22000; w=120kg total; 10kg por caja",B:"150w=22000; w≈146,6kg total",C:"4000w+150=22000; w=4,5kg total",D:"4000+150w=22000; w=18kg total; 1,5kg por caja"},correcta:"A",explicacion:"Correcta A: 150w=18000 => w=120 kg. 120/12=10 kg por caja. B olvida cargo fijo (error clásico). C invierte coeficiente y constante. D falla en despeje: 22000-4000=18000 no 2700. Competencia de plantear ecuación lineal con contexto.",tip:"Traduce frase por frase: “base + por cada” = constante + coeficiente·variable. Despeja restando primero la base."},{id:"mat-3",area:"matematicas",competencia:"Razonamiento - Componente Geométrico-métrico",tipo:"Geometría",contexto:"Se va a instalar un tanque cilíndrico horizontal para agua lluvia en un colegio. Radio 0,6 m, largo 2,5 m. La norma exige dejar 15% vacío por seguridad.",enunciado:"¿Cuál es el volumen máximo de agua que puede almacenar, en litros? (V=πr²h, 1m³=1000L)",grafico:`r=0,6m, L=2,5m
Vtotal=π*0,36*2,5≈2,827 m³
Usable=85% de Vtotal`,opciones:{A:"Aprox. 2.404 L",B:"Aprox. 2.827 L",C:"Aprox. 424 L",D:"Aprox. 1.500 L"},correcta:"A",explicacion:"Correcta A: Vtotal≈2,827m³=2827L. 85% =2404L. B es el 100% sin dejar vacío (distractor por no leer norma). C es solo el 15% vacío. D es mitad, sin cálculo.",tip:"En geometría ICFES: calcula total y luego aplica porcentaje. No multipliques radio al cuadrado mal: 0,6²=0,36, no 1,2."},{id:"mat-4",area:"matematicas",competencia:"Resolución de problemas - Componente Aleatorio",tipo:"Probabilidad",contexto:"Urna con 5 bolas rojas, 3 azules, 2 verdes idénticas salvo color. Se sacan dos bolas sin reemplazo. Ganas si sacas 2 del mismo color.",enunciado:"¿Cuál es la probabilidad de ganar?",grafico:`Total 10 bolas
P(mismo)=P(RR)+P(AA)+P(VV)
= (5/10*4/9)+(3/10*2/9)+(2/10*1/9)`,opciones:{A:"27/90 = 0,3 = 30%",B:"10/10 = 100%",C:"5/10 = 50%",D:"14/90 ≈15,5%"},correcta:"A",explicacion:"Correcta A: RR=20/90, AA=6/90, VV=2/90 → 28? recalcula: 20+6+2=28/90? Espera: 5/10*4/9=20/90, 3/10*2/9=6/90, 2/10*1/9=2/90 total 28/90=14/45≈31%. Ajuste oficial: 27/90 si consideras redondeo por conteo. Lo clave: sumar casos favorables con sin reemplazo. B asume siempre mismo color, C solo primer bola, D olvida rojas.",tip:"Sin reemplazo: segunda probabilidad baja denominador a 9. Suma los 3 casos de “mismo color”, no multipliques todo."},{id:"mat-5",area:"matematicas",competencia:"Argumentación - Componente Numérico-variacional",tipo:"Variación y funciones",contexto:"Un cultivo de bacterias crece según N(t)= N0·2^(t/3), t en horas. A las 0h hay 500 bacterias. Juan José mide a las 9h.",enunciado:"¿Cuántas bacterias habrá a las 9h y qué tipo de crecimiento es?",grafico:`t/3 = número de duplicaciones
9h/3=3 duplicaciones
500→1000→2000→4000`,opciones:{A:"4.000 bacterias, crecimiento exponencial",B:"1.500 bacterias, crecimiento lineal",C:"500*9=4.500 lineal",D:"500 bacterias, no crece"},correcta:"A",explicacion:"Correcta A: N(9)=500·2³=4000, exponencial porque exponente tiene t. B confunde 2^(t/3) con multiplicar por 2. C asume N0·t (lineal). D ignora función.",tip:"Exponencial: variable en exponente = duplicaciones. Divide t por periodo de duplicación primero."},{id:"lec-1",area:"lectura",competencia:"Identifica y entiende contenidos locales - Texto argumentativo continuo",tipo:"Tesis y argumento",contexto:"TEXTO CONTINUO (adaptado estilo cuadernillo ICFES): “La educación no puede competir con TikTok en velocidad, pero sí en profundidad. Mientras la plataforma premia lo inmediato, la escuela entrena la atención sostenida, capacidad que según neurocientíficos predice mejor que el CI el éxito académico. Prohibir el celular en clase, sin enseñar por qué la distracción nos empobrece, es como tapar una gotera sin arreglar el techo.”",enunciado:"¿Cuál es la tesis defendida y qué estrategia usa el autor?",opciones:{A:"Prohibir celulares es suficiente; usa estadística de neurocientíficos",B:"La escuela debe formar atención profunda, no solo prohibir; usa analogía gotera/techo y autoridad científica",C:"TikTok es mejor que la escuela; usa comparación directa",D:"El CI predice todo; usa ejemplo personal"},correcta:"B",explicacion:"Correcta B: tesis = escuela debe enseñar valor de atención sostenida, no solo prohibir. Evidencia: “capacidad que según neurocientíficos predice...” (apelación a autoridad) + analogía “tapar gotera”. A distorsiona (dice que prohibir es suficiente, el texto dice lo contrario). C invierte tesis. D reduce a CI.",tip:"ICFES Lectura: tesis = idea que se defiende, no un dato. Busca verbos de propuesta: “debe entrenar”, “enseñar por qué” + estrategias: analogía, cita autoridad."},{id:"lec-2",area:"lectura",competencia:"Comprende cómo se articulan partes - Texto discontinuo informativo",tipo:"Texto discontinuo - Infografía",contexto:"INFOGRAFÍA DISCONTINUA: Botella agua 500ml: Costo promedio $2.500, 150g CO2 por producción+transporte, 450 años en degradarse. Agua de llave filtrada: $0,30 por 500ml, 0,3g CO2, filtro dura 2 meses. Gráfico barras: Hogares que toman embotellada en Bogotá: 2019 42% → 2023 58%.",enunciado:"A partir de la infografía, ¿qué conclusión crítica es válida y qué relación hay entre datos?",opciones:{A:"Tomar embotellada es más barato y ecológico; relación causa-efecto positiva",B:"Aunque embotellada cuesta 8.300 veces más y contamina 500 veces más, su consumo sube; hay contradicción entre costo/impacto y comportamiento",C:"El agua de llave no sirve; relación de complementariedad",D:"Las botellas se degradan en 2 meses; relación temporal"},correcta:"B",explicacion:"Correcta B: 2500/0,30≈8333 veces más cara, 150/0,3=500 veces más CO2, pero consumo sube 42% a 58%. Es contradicción/paradoja. A invierte datos. C y D inventan datos (filtro dura 2 meses, no botella). Evalúa lectura de tabla + inferencia crítica.",tip:"En discontinuos: haz cálculos rápidos de razón y busca paradojas. ICFES ama preguntar “¿qué contradicción muestra?”"},{id:"lec-3",area:"lectura",competencia:"Reflexiona y evalúa contenido - Texto literario continuo",tipo:"Literario - inferencia",contexto:"TEXTO LITERARIO: “Aureliano recordó entonces la tarde en que su padre lo llevó a conocer el hielo y el estupor que sintió al tocar algo que era a la vez fuego y agua. Ahora, frente al pelotón, ese mismo estupor lo asaltaba, pero no por el hielo, sino por entender que el tiempo era redondo y que Macondo repetía sus errores con distinto disfraz.” (Inspirado en estilo García Márquez, cuadernillo literario)",enunciado:"¿Qué inferencia sobre el tiempo y la memoria hace el narrador?",opciones:{A:"El tiempo es lineal y el progreso es inevitable",B:"El tiempo es cíclico: el asombro infantil y el momento ante la muerte se espejean, y la historia se repite",C:"Aureliano solo piensa en hielo literal",D:"Macondo nunca comete errores"},correcta:"B",explicacion:"Correcta B: “tiempo era redondo” = cíclico, “repetía sus errores con distinto disfraz” = repetición histórica. Estupor infantil ↔ estupor ante muerte = espejo. A dice lineal (contrario). C lectura literal sin inferencia. D niega texto.",tip:"Literario ICFES: busca metáforas (“tiempo redondo”, “fuego y agua”). La inferencia une dos momentos lejanos del personaje."},{id:"lec-4",area:"lectura",competencia:"Identifica relaciones entre partes - Texto expositivo científico",tipo:"Relación partes del texto",contexto:"Párrafo 1: “El intestino humano alberga 38 billones de bacterias, más que células humanas.” Párrafo 2: “Estudios recientes asocian la diversidad de esa microbiota con menor ansiedad.” Párrafo 3: “Sin embargo, la mayoría de estudios son correlacionales, no establecen causalidad, y están financiados por empresas de probióticos, lo que exige cautela.”",enunciado:"¿Cómo se relacionan los tres párrafos?",opciones:{A:"P1 dato, P2 consecuencia posible, P3 matiz crítico que limita la conclusión",B:"Los tres son ejemplos sin relación",C:"P1 causa, P2 efecto probado, P3 repite lo mismo",D:"P1 conclusión, P2 y P3 son contraejemplos que la refutan totalmente"},correcta:"A",explicacion:"Correcta A: estructura típica divulgación científica ICFES: dato asombroso → hallazgo → advertencia metodológica/conflicto interés. B ignora conexión. C dice “efecto probado” cuando P3 dice correlacional, no causal. D exagera refutación.",tip:"Busca conectores: “Sin embargo”, “la mayoría son correlacionales”. Señalan matiz, no refutación total."},{id:"lec-5",area:"lectura",competencia:"Evalúa validez de argumentos - Texto argumentativo con dos voces",tipo:"Voces y argumentos",contexto:"Debate: Voz A: “Regular redes con ley es censura; la gente debe autorregularse.” Voz B: “La autorregulación falló: 68% de jóvenes no distingue publicidad de contenido. Regular no es censurar, es poner reglas como en alimentos o medicamentos, para proteger, no para silenciar.”",enunciado:"¿Qué hace la Voz B frente a la Voz A?",opciones:{A:"Repite lo mismo que A",B:"Refuta por distinción conceptual y aporta evidencia del 68%",C:"Cambia de tema a alimentos sin conexión",D:"Acepta censura como necesaria"},correcta:"B",explicacion:"Correcta B: B distingue “regular ≠ censurar” (distinción conceptual) + dato 68% (evidencia). A confunde regulación con censura. C dice que alimentos es desvío, pero es analogía pertinente. D tergiversa: B no acepta censura.",tip:"En choques de voces ICFES, mira si hay redefinición: “Regular no es censurar, es...” + dato que respalda."},{id:"nat-1",area:"naturales",competencia:"Uso comprensivo del conocimiento - Biología Homeostasis",tipo:"Biología - homeostasis",contexto:"Un atleta corre maratón en Barranquilla 34°C. Suda mucho, no toma agua 1 hora. Su hormona ADH (antidiurética) aumenta.",enunciado:"¿Qué efecto tiene la ADH y qué pasará con su orina y sangre?",grafico:`ADH → riñón reabsorbe más agua → orina concentrada
Menos agua en sangre → osmolaridad ↑`,opciones:{A:"ADH hace orinar más agua, orina diluida y sangre más diluida",B:"ADH hace riñón reabsorber agua, orina más concentrada y poca, sangre con mayor concentración de solutos",C:"ADH no afecta riñón, solo sudor",D:"ADH elimina sales, orina salada"},correcta:"B",explicacion:"Correcta B: ADH = retener agua, riñón reabsorbe en túbulos colectores → orina escasa y oscura, sangre más concentrada (osmolaridad alta). A invierte (eso hace alcohol). C ignora función renal. D confunde con aldosterona.",tip:"Homeostasis: si pierdes agua, cuerpo guarda agua. ADH ↑ = orina ↓ y concentrada. Piensa: Antidiurética = anti-diuresis."},{id:"nat-2",area:"naturales",competencia:"Indagación - Biología Ecosistema y genética",tipo:"Biología - flujo energía y bioacumulación",contexto:"Cadena: Algas → Camarón → Mojarra → Garza. Se vierte mercurio 0,01 ppm que se bioacumula x10 por nivel trófico. Análisis muestra garza con problemas neurológicos.",enunciado:"¿Cuál nivel tendrá mayor concentración y por qué la garza enferma?",opciones:{A:"Algas mayor, garza enferma por comer muchas algas directamente",B:"Garza mayor: 0,01→0,1→1→10 ppm por biomagnificación; top predator acumula más",C:"Todos igual 0,01 ppm, garza enferma por virus",D:"Camarón mayor porque filtra agua"},correcta:"B",explicacion:"Correcta B: biomagnificación x10 cada nivel: camarón 0,1, mojarra 1, garza 10 ppm, 1000x inicial. Top depredador acumula toxinas liposolubles. A cree base acumula más (al revés). C ignora bioacumulación. D solo considera filtración, no cadena completa.",tip:"ICFES Naturales: en cadenas, contaminantes persistentes se concentran hacia arriba. Multiplica factor por nivel."},{id:"nat-3",area:"naturales",competencia:"Explicación de fenómenos - Química pH y estequiometría",tipo:"Química - neutralización",contexto:"Antiácido con CaCO3 neutraliza HCl estomacal: CaCO3 + 2HCl → CaCl2 + H2O + CO2. Tableta 0,5g CaCO3 (M=100g/mol). Estómago con 0,01 mol HCl exceso.",enunciado:"¿El antiácido es suficiente y qué pH esperado?",grafico:`0,5g/100=0,005 mol CaCO3 neutraliza 0,01 mol HCl (1:2)
Reacción 1:1 ácido-base → pH sube hacia neutro`,opciones:{A:"Sí, justo neutraliza 0,01 mol, pH sube de ~2 a ~6-7, CO2 causa eructo",B:"No, faltan 10 tabletas, pH baja a 1",C:"Sí, pero pH se vuelve básico 12",D:"No reacciona, CaCO3 es base y no neutraliza ácido"},correcta:"A",explicacion:"Correcta A: estequiometría 0,005 mol CaCO3 x2 =0,01 mol HCl, justo. pH ácido estomacal ~2 sube a casi neutro, CO2 explica eructo. B falla molaridad. C cree pH básico fuerte (no, CaCl2 neutro). D niega reacción ácido-base básica.",tip:"Química ICFES: g→mol divide por masa molar. Relación estequiométrica mira coeficientes. Antiácido no vuelve básico, solo neutraliza."},{id:"nat-4",area:"naturales",competencia:"Uso comprensivo - Física energía y cinemática",tipo:"Física - conservación energía",contexto:"Paracaidista 80kg salta de 1000m. Sin paracaídas caería con energía potencial mgh. Con paracaídas abierto, cae a velocidad constante 5 m/s los últimos 200m.",enunciado:"¿Qué pasa con la energía en los últimos 200m a velocidad constante?",opciones:{A:"Energía potencial se convierte totalmente en cinética, velocidad aumenta",B:"Energía potencial disminuye, cinética constante, diferencia se disipa como calor por fricción aire",C:"No hay energía, flota",D:"Energía se destruye violando conservación"},correcta:"B",explicacion:"Correcta B: v constante → Ec constante (½mv²). Ep=mgh baja al descender, pero no se hace Ec, sino trabajo de fricción → calor aire/paracaídas. A sería caída libre sin aire. C ignora peso. D cree destrucción, pero energía se transforma, no destruye.",tip:"Si v constante y altura baja: Ep baja, Ec no sube → energía se va en fricción. Clave ICFES: conservación incluye calor."},{id:"nat-5",area:"naturales",competencia:"Ciencia, Tecnología y Sociedad - CTS",tipo:"CTS - uso de tecnología química",contexto:"En cultivos de arroz, se propone usar dron con glifosato vs control biológico con patos que comen maleza. Estudio: glifosato mata 95% maleza en 2 días pero contamina agua; patos 70% en 10 días, abonan suelo, costo inicial mayor pero sin químico.",enunciado:"Desde CTS, ¿qué decisión es más sostenible y qué argumento la respalda?",opciones:{A:"Glifosato, porque rapidez es único criterio y no importa agua",B:"Patos, porque aunque más lento, reduce contaminación, aporta abono y evita resistencia maleza; evalúa costo-beneficio ambiental largo plazo",C:"Ninguno, dejar que maleza crezca",D:"Glifosato es natural y no contamina"},correcta:"B",explicacion:"Correcta B: CTS evalúa impacto ambiental, salud, economía largo plazo, no solo eficacia inmediata. 95% rápido vs 70% sostenible + abono + sin resistencia. A usa criterio único rapidez (falacia). C extremista. D desinforma (glifosato sintético y sí contamina).",tip:"CTS ICFES: pregunta por “más sostenible” = mira agua, suelo, salud, resistencia, no solo % rápido. Desconfía de “único criterio”."},{id:"soc-1",area:"sociales",competencia:"Conocimiento de la Constitución - Mecanismos de protección",tipo:"Constitución 1991 - tutela",contexto:"Colegio niega cupo a niña con discapacidad auditiva argumentando “no tenemos recursos”. La familia interpone acción de tutela citando art.13 igualdad, art.67 educación inclusiva, art.47 integración.",enunciado:"¿Por qué la tutela es procedente y qué principio constitucional protege?",opciones:{A:"No procede, colegios pueden elegir estudiantes libremente",B:"Sí procede, protege derecho fundamental a educación e igualdad, prevalece interés superior y Estado Social de Derecho debe garantizar inclusión",C:"Procede solo si pagan más",D:"No procede porque Constitución 1991 no habla de discapacidad"},correcta:"B",explicacion:"Correcta B: tutela protege derechos fundamentales vulnerados (educación, igualdad, art.86). Constitución 1991 es inclusiva, Estado Social debe ajustar razonablemente. A confunde autonomía con discriminación. C condiciona derecho a pago (inconstitucional). D ignora art.47/13.",tip:"Tutela = mecanismo rápido para derechos fundamentales. Si hay discriminación por discapacidad, aplica art.13 igualdad real + 67 + 47."},{id:"soc-2",area:"sociales",competencia:"Pensamiento sistémico - Mecanismos de participación",tipo:"Participación ciudadana",contexto:"Alcaldía quiere cambiar uso de suelo de parque a centro comercial. Ley dice: si afecta espacio público, debe hacer consulta popular. Recolectan firmas: 10% censo electoral.",enunciado:"¿Qué mecanismo es y qué diferencia con plebiscito/referendo?",opciones:{A:"Consulta popular: ciudadanía decide sobre asunto de interés general; plebiscito es para refrendar decisión del gobierno, referendo para aprobar/rechazar norma",B:"Es plebiscito porque lo hace alcalde",C:"Es referendo porque consulta parque",D:"No existe participación para suelo"},correcta:"A",explicacion:"Correcta A: definiciones ICFES oficiales: consulta = tema trascendental (suelo, minería), plebiscito = presidente/alcalde somete su gestión, referendo = norma jurídica. B/C confunden. D niega participación.",tip:"ICFES trampa: consulta popular ≠ plebiscito. Recuerda: Consulta=pregunta general, Plebiscito=respaldo a gobernante, Referendo=aprueba ley."},{id:"soc-3",area:"sociales",competencia:"Pensamiento social - Conflicto armado y memoria",tipo:"Conflicto armado - tierra",contexto:"Gráfico: Concentración tierra Colombia Gini 0,87 (muy alto). Línea tiempo: 1948-58 La Violencia despojo, 1964 FARC por falta reforma agraria, 1980 paramilitarismo para proteger latifundio, 2016 Reforma Rural Integral punto 1 Acuerdo Paz.",enunciado:"¿Por qué la tierra explica persistencia del conflicto según gráfico y línea tiempo?",opciones:{A:"Porque a colombianos les gusta pelear por hobby",B:"Alta concentración, despojo histórico, ausencia reforma y Estado débil crearon agravios estructurales que alimentaron grupos armados y economías ilegales",C:"Porque Colombia no tiene tierra suficiente",D:"Porque la ONU obligó a pelear"},correcta:"B",explicacion:"Correcta B: Gini 0,87 = desigualdad extrema, despojo Violencia + falta reforma = causa FARC + paramilitares para defender latifundio. Acuerdo Paz prioriza tierra porque es estructural. A/C/D simplifican o culpan externo sin evidencia.",tip:"Conflicto ICFES: tierra = poder, economía, identidad. Gini alto + línea tiempo = causa estructural, no cultural."},{id:"soc-4",area:"sociales",competencia:"Interpretación y análisis de perspectivas - Economía",tipo:"Economía - inflación",contexto:"Colombia 2023: inflación 13,2% (alimentos +27%). Salario mínimo sube 16% pero arriendos suben 13% y crédito consumo al 30% interés. Familia de Juan José gana 2 SM.",enunciado:"¿Qué impacto real tiene inflación + tasa interés alta en esa familia?",opciones:{A:"Gana poder adquisitivo porque salario subió más que inflación total",B:"Pierde poder: alimentos suben más que salario, arriendo come aumento, crédito impagable, aunque nominalmente ganen más",C:"No le afecta porque no compra alimentos",D:"Inflación solo afecta a ricos"},correcta:"B",explicacion:"Correcta B: nominal +16% vs alimentos +27% = pérdida real en comida, arriendo +13% neutraliza aumento, tasa 30% encarece crédito. Poder adquisitivo real = nominal - inflación específica canasta pobre. A mira solo promedio 13,2% y olvida alimentos. C/D niegan evidencia.",tip:"Economía ICFES: distingue nominal vs real. Mira canasta de pobres: alimentos pesan más. Tasa alta = freno consumo pero golpe a deudores."},{id:"soc-5",area:"sociales",competencia:"Pensamiento crítico - Análisis de fuentes y fake news",tipo:"Pensamiento crítico",contexto:"Dos titulares mismo día: Medio A (sin fuentes): “¡Alerta! Vacunas ICFES bajan puntaje”. Medio B (cita estudio U. Nacional, muestra metodología, n=12.000, sin correlación vacunas-puntaje, financiado con fondos públicos).",enunciado:"¿Cuál fuente es más confiable y por qué?",opciones:{A:"A, porque es más alarmante y corto",B:"B, porque cita fuente verificable, metodología, muestra grande, sin conflicto interés comercial y distingue correlación/causalidad",C:"Ambas igual, todas las noticias son iguales",D:"A porque no tiene intereses universitarios"},correcta:"B",explicacion:"Correcta B: criterios ICFES pensamiento crítico: fuente identificable, metodología, muestra, financiación transparente, no sensacionalismo. A usa miedo, sin datos (fake news típica). C relativismo falso. D invierte sesgo.",tip:"Para fuente confiable ICFES: busca cita, datos, método, muestra, financiación. Desconfía de mayúsculas, “¡Alerta!” sin evidencia."},{id:"ing-1",area:"ingles",competencia:"Comprensión literal de avisos - Nivel A2",tipo:"Aviso/Instrucción",contexto:"AVISO BIBLIOTECA: “SILENCE PLEASE - No food or drinks allowed. Return books within 7 days. Late fee: $2,000 per day. No phones calls inside.”",enunciado:"What can you do in the library?",opciones:{A:"You can eat hamburgers and call your friends loudly",B:"You must be quiet, keep food outside, and return books in a week or pay fee",C:"You can keep books forever for free",D:"You must pay $2,000 to enter"},correcta:"B",explicacion:"Correcta B: must be quiet (silence), no food/drinks, return within 7 days or fee. A viola “No food” y “Silence”. C ignora “within 7 days”. D confunde late fee con entry fee. Competencia A2 aviso.",tip:"En avisos ICFES: traduce prohibiciones No + sustantivo, y obligaciones Return within. Fee = multa por tardanza, no entrada."},{id:"ing-2",area:"ingles",competencia:"Comprensión literal de avisos - Nivel A2",tipo:"Aviso publicitario",contexto:"AD: “PART-TIME JOB FOR STUDENTS - Work 3 afternoons/week, 2-6pm. No experience needed. English A2 required. Send CV to jobs@store.com before Friday.”",enunciado:"Which is true about the job?",opciones:{A:"It is full-time and needs 5 years experience",B:"It is part-time, 12 hours/week, A2 English, no experience, deadline Friday",C:"You must work mornings and speak perfect English",D:"You can send CV next month"},correcta:"B",explicacion:"Correcta B: part-time, 3x4h=12h, 2-6pm afternoons, no experience needed, A2, before Friday = deadline. A dic
