blación juvenil 10M.",enunciado:"¿Cuántos jóvenes desempleados menos 2023 vs 2020 y tendencia?",grafico:"Desempleados = %*10M",opciones:{A:"740k menos; tendencia baja desde 2020",B:"740k más",C:"16,5% menos que 2019",D:"Sin cambio"},correcta:"A",explicacion:"2020 2,39M 2023 1,65M diff 0,74M menos. Tendencia baja post pandemia. B invierte. C compara mal año. D ignora.",tip:"Diferencia = resta % * población."},{id:"mat-11",area:"matematicas",competencia:"Formulación - Variacional",tipo:"Plan celular",contexto:"Plan recarga: $2.000 base + $50/minuto. Juan José habla 120 min mes. Si habla >100min minuto extra cuesta $30.",enunciado:"¿Costo con tarifa escalonada?",grafico:"100*50=5000 +20*30=600 +2000 base",opciones:{A:"$7.600",B:"$8.000 (120*50+2000)",C:"$2.000 solo base",D:"$6.000"},correcta:"A",explicacion:"A 2000+5000+600=7600. B tarifa plana sin escalón. C solo base. D olvida base.",tip:"Tarifa escalonada parte en tramos."},{id:"mat-12",area:"matematicas",competencia:"Razonamiento - Variacional",tipo:"Cuadrática altura",contexto:"Balón altura h(t)= -5t²+20t metros, t segundos. Vuelo hasta tocar suelo.",enunciado:"¿Altura máxima y tiempo?",grafico:"Vértice -b/2a? Aquí completa: t_v= -b/(2a) =20/10=2s h=20",opciones:{A:"20m a los 2s",B:"10m a 1s",C:"40m a 4s",D:"0m siempre"},correcta:"A",explicacion:"A vértice 2s h= -20+40=20. B mitad. C tiempo total no altura. D suelo.",tip:"Altura max cuadrática en vértice t=-b/2a."},{id:"mat-13",area:"matematicas",competencia:"Formulación - Numérico",tipo:"Sistema ecuaciones",contexto:"Cine: 2 adultos+3 niños=$45.000, 1 adulto+1 niño=$16.000. Mismo precio por tipo.",enunciado:"¿Precio adulto y niño?",grafico:"2A+3N=45k A+N=16k → A=3k? Resuelve",opciones:{A:"Adulto $9.000 Niño $7.000 (9+7=16 18+21=39? espera 18+21=39 no 45). Ajuste: Adulto $10.000 Niño $6.000? 20+18=38 no. Solución real: Adulto $9k Niño $7k? 2*9+3*7=18+21=39 no. Recalcula: A= $12k N=4k? 24+12=36. A=11k N=5k 22+15=37. Vamos: A=13k N=3k 26+9=35. Mejor sistema: resta 2*(A+N)=32k de primera: (2A+3N)-(2A+2N)=N=13k, A=3k. Entonces Adulto $3k Niño $13k",B:"Adulto $13k Niño $3k",C:"Adulto $8k Niño $8k",D:"Adulto $10k Niño $6k"},correcta:"A",explicacion:"Correcta A sistema da N=45-32=13k A=3k. B invierte pero matemáticamente adulto 3k niño 13k es raro pero algebra manda. C asume igual. D no cumple.",tip:"Resta ecuaciones para eliminar variable."},{id:"mat-14",area:"matematicas",competencia:"Razonamiento - Variacional",tipo:"Proporcionalidad",contexto:"6 obreros hacen cancha en 12 días trabajando 8h/día. Alcaldía pone 9 obreros.",enunciado:"¿Días si mantienen 8h/día? ¿Y si 9 obreros trabajan 6h/día?",grafico:"Obreros inverso a días",opciones:{A:"8 días con 8h; 10,66≈11 días con 6h",B:"18 días",C:"12 días igual",D:"6 días y 6 días"},correcta:"A",explicacion:"6*12=72 obreros-día. 72/9=8 días. Con 6h factor 8/6 =>8*8/6=10,66. B directa no inversa. C ignora. D mal.",tip:"Más obreros menos días inversa. Menos horas más días inversa."},{id:"mat-15",area:"matematicas",competencia:"Resolución - Aleatorio",tipo:"Combinatoria comité",contexto:"Curso 10 estudiantes 6 mujeres 4 hombres eligen 2 al azar para comité.",enunciado:"¿Probabilidad ambas mujeres?",grafico:"C(6,2)/C(10,2)=15/45=1/3",opciones:{A:"15/45=1/3≈33,3%",B:"6/10=60%",C:"6/10*6/10=36%",D:"1/2"},correcta:"A",explicacion:"A combinaciones sin orden. B solo una mujer. C con reemplazo. D asume mitad.",tip:"Comité sin orden usa combinaciones."},{id:"mat-16",area:"matematicas",competencia:"Razonamiento - Geométrico",tipo:"Área lote",contexto:"Lote rectangular perímetro 60m largo doble ancho. Quieren sembrar café, cada mata 3m².",enunciado:"¿Ancho, largo, área y matas?",grafico:"2*(a+2a)=60→3a=30→a=10 l=20 area 200",opciones:{A:"Ancho 10m largo 20m área 200m² ≈66 matas",B:"10x10 100m²",C:"30x15 450m²",D:"20x20 400m²"},correcta:"A",explicacion:"A resuelve 6a=60→a=10. Área 200. 200/3≈66. B cuadrado. C mitad perim. D cuadrado.",tip:"Perímetro 2*(b+h)."},{id:"mat-17",area:"matematicas",competenc r transición."},{id:"lec-9",area:"lectura",competencia:"Identifica contenidos - Argumentativo",tipo:"Educación memoria",contexto:"TEXTO: “Memorizar fechas sin contexto es como guardar llaves sin saber qué puerta abren. Memoria sin comprensión es frágil. Comprensión sin memoria es vacía. Necesitamos ambas: entender procesos y retener datos clave que anclan comprensión.”",enunciado:"¿Idea principal?",opciones:{A:"Solo memorizar fechas",B:"Memoria y comprensión complementarias, analogía llaves puerta",C:"No memorizar nunca",D:"Llaves abren puertas literales"},correcta:"B",explicacion:"B complementariedad analogía. A solo memoria. C solo comprensión. D literal.",tip:"Analogía llaves=fechas sin contexto inútiles."},{id:"lec-10",area:"lectura",competencia:"Evalúa argumentos - Continuo",tipo:"Ciencia café",contexto:"TEXTO: “Estudio con 10 personas dice café cura cáncer. Estudio con 10.000 con metodología rigurosa no encuentra cura pero reduce riesgo 10%. ¿Cuál creemos? El primero es viral porque esperanza vende, pero ciencia avanza por muestras grandes, no por anécdotas.”",enunciado:"¿Qué critica?",opciones:{A:"Café malo",B:"Preferencia por anécdota viral vs evidencia robusta muestra grande metodología",C:"Cáncer no existe",D:"10 personas suficiente"},correcta:"B",explicacion:"B critica viralidad anécdota vs robustez. A café malo no. C negación. D opuesto.",tip:"Muestra grande vs anécdota."},{id:"lec-11",area:"lectura",competencia:"Reflexiona - Literario",tipo:"Poesía ciudad",contexto:"POEMA: “Bogotá, a 2.600 metros más cerca de estrellas y más lejos del mar. Aquí el frío no es clima sino costumbre, nos abrigamos en capas de historias no contadas.”",enunciado:"¿Qué significa frío como costumbre?",opciones:{A:"Frío literal climático",B:"Metáfora reserva emocional distancia social y altura como símbolo",C:"Bogotá está cerca del mar",D:"Capas de ropa literal"},correcta:"B",explicacion:"B metáfora reserva emocional, altura, historias no contadas. A literal. C falso geográfico. D literal ropa.",tip:"Poesía metáfora no literal."},{id:"lec-12",area:"lectura",competencia:"Identifica voces - Literario",tipo:"Narrador y personaje",contexto:"“Yo, que nunca creí en fantasmas, vi a mi abuela en la cocina haciendo arepas como si no hubiera muerto. Mi hermano dijo que era hambre, yo dije que era memoria que se cocina.”",enunciado:"¿Qué voces y perspectiva?",opciones:{A:"Dos interpretaciones fantasma: racional hambre vs memoria simbólica; narrador en primera persona",B:"Una sola voz fantasma real",C:"Narrador omnisciente objetivo",D:"No hay voces"},correcta:"A",explicacion:"A hermano racional vs narrador simbólico. B solo fantasma. C omnisciente no primera persona. D niega.",tip:"Voz racional vs simbólica típico literario."},{id:"lec-13",area:"lectura",competencia:"Inferencia - Literario",tipo:"Final abierto",contexto:"Cuento termina: “Dejó la maleta en la puerta, miró el reloj, miró la lluvia, y se sentó a esperar sin saber si esperaba que dejara de llover o que alguien volviera.”",enunciado:"¿Qué sugiere final?",opciones:{A:"Decisión clara irse",B:"Ambigüedad indecisión entre quedarse irse; lluvia y reloj símbolos tiempo y duda",C:"Maleta es basura",D:"Lluvia literal solo"},correcta:"B",explicacion:"B final abierto ambigüedad símbolos. A decisión clara no. C maleta basura literal. D solo lluvia.",tip:"Final abierto símbolos lluvia duda."},{id:"lec-14",area:"lectura",competencia:"Comprende articulación - Literario",tipo:"Realismo mágico",contexto:"P1: Pueblo sin agua 3 años. P2: Llega anciana dice lloverá si todos cuentan historia triste al tiempo. P3: Llovió pero no por magia sino porque contar historias hizo que se organizaran y arreglaran acueducto.",enunciado:"¿Relación realismo mágico?",opciones:{A:"Magia real lluvia por hechizo",B:"Elemento mágico como excusa para acción colectiva racional",C:"No hay magia",D:"Acueducto mágico"},correcta:"B",explicacion:"B magia como metáfora que dispara organización. A magia literal. C niega elemento mágico. D literal.",tip:"Realismo mágico magia como símbolo colectivo."},{id:"lec-15",area:"lectura",competencia:"Evalúa contenido - Literario",tipo:"Ironía",contexto:"Narrador dice: “Qué afortunados somos, trabajamos 12 horas para comprar cosas que no necesitamos con plata que no tenemos para impresionar a gente que no nos quiere.”",enunciado:"¿Qué figura?",opciones:{A:"Ironía crítica consumo",B:"Felicidad por trabajo",C:"Consejo financiero literal",D:"Elogio consumo"},correcta:"A",explicacion:"A ironía afortunados cuando critica. B felicidad no. C literal no. D elogio opuesto.",tip:"Ironía dice lo contrario a lo que piensa."},{id:"lec-16",area:"lectura",competencia:"Identifica - Literario",tipo:"Tesis implícita",contexto:"Fábula: Zorro promete gallinas seguridad si votan por él, luego se las come. Gallinas dicen próximo votaremos mejor pero no revisan propuestas.",enunciado:"¿Moraleja política?",opciones:{A:"Zorros buenos",B:"Votar sin revisar propuestas lleva a repetir abuso poder",C:"Gallinas no deben votar",D:"Fábula sobre granja literal"},correcta:"B",explicacion:"B moraleja crítica voto desinformado repetición. A zorros buenos no. C no votar no. D literal.",tip:"Fábula moraleja política."},{id:"lec-17",area:"lectura",competencia:"Comprende - Literario",tipo:"Contexto histórico",contexto:"Texto 1920: “Mujeres marchan por voto. Hombres dicen su cerebro más pequeño no puede política.”",enunciado:"¿Qué revela?",opciones:{A:"Argumento biologicista para negar derechos",B:"Cerebro pequeño real",C:"Mujeres no querían voto",D:"1920 igualdad total"},correcta:"A",explicacion:"A prejuicio biologicista para exclusión. B valida prejuicio. C niega marcha. D igualdad total falso histórico.",tip:"Argumento pseudocientífico para exclusión."},{id:"lec-18",area:"lectura",competencia:"Articula - Discontinuo",tipo:"Infografía energía",contexto:"INFOGRAFÍA: Consumo hogar estrato 2: 60% nevera vieja 30% iluminación incandescente 10% otros. Estrato 6: 25% aire acondicionado 25% nevera 20% p
